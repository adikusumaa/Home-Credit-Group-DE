networks:
  mage_network:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  postgres_data:
  postgres_airflow_data:
  redis_data:
  opensearch_data:

services:
  namenode:
    image: bde2020/hadoop-namenode:latest
    container_name: namenode
    networks:
      - mage_network
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_hadoop_proxyuser_root_hosts=*
      - CORE_CONF_hadoop_proxyuser_root_groups=*
      - DFS_CONF_dfs_permissions_enabled=false
      - HADOOP_HEAPSIZE=512   # <-- BATASI HEAP NAMENODE
    ports:
      - 9870:9870
    deploy:
      resources:
        limits:
          memory: 768M   # <-- MAKSIMAL 768 MB

  datanode:
    image: bde2020/hadoop-datanode:latest
    container_name: datanode
    networks:
      - mage_network
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:8020
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - DFS_NAMENODE_RPC_ADDRESS=namenode:8020
      - HADOOP_HEAPSIZE=256
    depends_on:
      - namenode
    deploy:
      resources:
        limits:
          memory: 512M

  spark-master:
    image: spark-ge:3.5.1
    container_name: spark-master
    networks:
      - mage_network
    ports:
      - 18080:8080
      - 7077:7077
      - 8888:8888
    volumes:
      - ./jobs:/opt/jobs
    environment:
      - SPARK_DAEMON_MEMORY=512m  # <-- BATASI MEMORY MASTER
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    deploy:
      resources:
        limits:
          memory: 768M

  spark-worker:
    image: spark-ge:3.5.1
    container_name: spark-worker
    networks:
      - mage_network
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1g   # <-- TURUNKAN DARI 2g JADI 1g
      - SPARK_WORKER_CORES=1     # <-- TURUNKAN DARI 2 JADI 1 CORE
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          memory: 1536M  # <-- MAKSIMAL 1.5 GB

  postgres_metastore:
    image: postgres:13
    container_name: postgres_metastore
    networks:
      - mage_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          memory: 256M

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    networks:
      - mage_network
    ports:
      - 9083:9083
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - DFS_NAMENODE_RPC_ADDRESS=namenode:8020
      - HIVE_METASTORE_WAREHOUSE_DIR=hdfs://namenode:8020/user/hive/warehouse
      - HIVE_METASTORE_DB_DRIVER=postgres
      - HIVE_METASTORE_DB_URL=jdbc:postgresql://postgres_metastore:5432/metastore
      - HIVE_METASTORE_DB_USER=hive
      - HIVE_METASTORE_DB_PASSWORD=hive
      - HADOOP_USER_NAME=root
      - HADOOP_HEAPSIZE=256   # <-- BATASI HEAP HIVE
    entrypoint: /bin/bash
    command: -c "/opt/hive/bin/hive --service metastore"
    depends_on:
      postgres_metastore:
        condition: service_started
      namenode:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    networks:
      - mage_network
    ports:
      - 10000:10000
      - 10002:10002
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - DFS_NAMENODE_RPC_ADDRESS=namenode:8020
      - HIVE_METASTORE_URIS=thrift://hive-metastore:9083
      - HIVE_WAREHOUSE_DIR=hdfs://namenode:8020/user/hive/warehouse
      - HADOOP_USER_NAME=root
      - HADOOP_HEAPSIZE=256
    entrypoint: /bin/bash
    command: -c "/opt/hive/bin/hiveserver2 -hiveconf hive.server2.enable.doAs=false"
    depends_on:
      postgres_metastore:
        condition: service_started
      namenode:
        condition: service_healthy
      hive-metastore:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768M

  postgres_airflow:
    image: postgres:13
    container_name: postgres_airflow
    networks:
      - mage_network
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M   # SUDAH ADA, TETAP PERTAHANKAN

  redis:
    image: redis:7
    container_name: redis
    networks:
      - mage_network
    volumes:
      - redis_data:/data
    ports:
      - 6379:6379
    deploy:
      resources:
        limits:
          memory: 256M   # <-- TAMBAHKAN BATASAN UNTUK REDIS

  airflow-init:
    image: airflow-custom:2.9.0
    container_name: airflow-init    
    networks:
      - mage_network
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "123admin"
    depends_on:
      postgres_airflow:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate && airflow users create -r Admin -u airflow -p airflow -e admin@example.com -f admin -l user && exit 0"
    deploy:
      resources:
        limits:
          memory: 512M   # <-- TAMBAHKAN BATASAN

  airflow-webserver:
    image: airflow-custom:2.9.0
    container_name: airflow-webserver    
    networks:
      - mage_network
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./ge_report:/opt/airflow/ge_report
    ports:
      - 18081:8080
    environment:
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__PARALLELISM: 1          # <-- WAJIB! HANYA 1 TASK SEJALAN
      AIRFLOW__CORE__DAG_CONCURRENCY: 1      # <-- WAJIB!
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "123admin"
    depends_on:
      postgres_airflow:
        condition: service_healthy
      redis:
        condition: service_started
    command: webserver
    deploy:
      resources:
        limits:
          memory: 512M   # <-- BATASI WEBSERVER

  airflow-scheduler:
    image: airflow-custom:2.9.0
    container_name: airflow-scheduler    
    networks:
      - mage_network
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./ge_report:/opt/airflow/ge_report
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__DAG_CONCURRENCY: 1
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "123admin"
    depends_on:
      postgres_airflow:
        condition: service_healthy
      redis:
        condition: service_started
    command: scheduler
    deploy:
      resources:
        limits:
          memory: 512M   # <-- BATASI SCHEDULER

  airflow-worker:
    image: airflow-custom:2.9.0
    container_name: airflow-worker
    networks:
      - mage_network
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./jobs:/opt/jobs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ge_report:/opt/airflow/ge_report
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__DAG_CONCURRENCY: 1
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW__CELERY__WORKER_CONCURRENCY: 1           # <-- TURUNKAN KE 1
      AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1   # <-- PASTIKAN HANYA 1 TASK
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "123admin"
    depends_on:
      postgres_airflow:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery worker
    deploy:
      resources:
        limits:
          memory: 1024M   # <-- NAIKKAN JADI 1GB

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    networks:
      - mage_network
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m   # <-- INI PALING PENTING! BATASI JVM KE 512MB
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          memory: 1024M   # <-- MAKSIMAL 1GB UNTUK OPENSEARCH


  crewai:
    image: python:3.11-slim
    container_name: crewai
    networks:
      - mage_network
    volumes:
      - ./crewai_scripts:/opt/crewai         
      - ./dags:/opt/airflow/dags              
      - ./:/opt/repo  
    working_dir: /opt/crewai
    environment:
      - AIRFLOW_API_USER=airflow
      - AIRFLOW_API_PASSWORD=airflow
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    command: >
      sh -c "apt-get update &&
            apt-get install -y git &&
            pip install --no-cache-dir -r requirements.txt &&
            git config --global --add safe.directory /opt/airflow/dags &&
            python app.py"
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      - opensearch
      - namenode